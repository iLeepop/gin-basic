app:
  env: dev # 环境 dev/test/prod
  name: "gin-basic"
  version: "0.0.1"
  api:
    host: "192.168.0.10"
    port: 8080

Log:
  level: "info" # 日志级别 debug/info/warn/error/fatal
  format: "json" # 日志格式
  output: "both" # 输出方式
  file_path: "./logs/app.Log" # 日志文件路径
  max_size: 100 # 单个日志文件最大大小
  max_backups: 5 # 保留的旧日志文件数量
  max_age: 30 # 日志文件保留天数
  compress: false # 是否压缩旧日志文件

mysql:
  host: "locallhost"
  port: 3306
  username: "root"
  password: |

redis:
  host: "localhost"
  port: 6379
  password: |
