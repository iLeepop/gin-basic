services:
  app:
    build:
      context: .
      dockerfile: app.Dockerfile
    container_name: gin-basic-app
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      APP_ENV: prod
      APP_API_PORT: "8080"
      LOG_LEVEL: info
      LOG_OUTPUT: stdout
      DATABASE_MYSQL_HOST: mysql
      DATABASE_MYSQL_PORT: "3306"
      DATABASE_MYSQL_USERNAME: root
      DATABASE_MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      DATABASE_MYSQL_DATABASE: ${MYSQL_DATABASE:-gin_basic}
      CACHE_REDIS_HOST: redis
      CACHE_REDIS_PORT: "6379"
      JWT_SECRET: ${JWT_SECRET:-change_me_in_production}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    container_name: gin-basic-mysql
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-gin_basic}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: gin-basic-postgres
    profiles:
      - postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DATABASE:-gin_basic}
      TZ: Asia/Shanghai
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DATABASE:-gin_basic}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: gin-basic-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  mysql_data:
  postgres_data:
  redis_data:
